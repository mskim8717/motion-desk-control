[package]
name = "desk-tray"
version = "0.0.2"
edition = "2021"

# cargo bundle --release -p desk-tray → MotionDesk.app
# Info.plist 추가 항목(BLE 권한 문구, LSUIElement)은 scripts/bundle.sh가 주입
[package.metadata.bundle]
name = "MotionDesk"
# scripts/gen_icon.py로 생성. 경로는 cargo bundle 실행 위치(워크스페이스 루트) 기준
icon = ["desk-tray/assets/icon.icns"]
identifier = "com.mskim8717.motiondesk"
category = "public.app-category.utilities"
short_description = "데스커 모션데스크 BLE 제어 메뉴바 앱"
osx_minimum_system_version = "12.0"

[dependencies]
desk-core = { path = "../desk-core" }
tokio = { workspace = true }
futures = "0.3"
tray-icon = "0.21"
tao = "0.34"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# transparent feature: macOS에서 웹뷰 배경 투명화 (팝오버 둥근 모서리에 필요)
wry = { version = "0.53", features = ["transparent"] }
